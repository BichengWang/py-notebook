[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-notebook"
version = "0.1.0"
description = "A Python notebook"
requires-python = ">=3.11"
dependencies = [
    # Core dependencies
    "memory-profiler",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "requests",
    "python-dateutil",
    "scipy",
    "seaborn",
    "backoff",
    "click",
    "mock",
    "pydump",
    # TensorFlow related
    "tensorflow>=2.10.0",
    "tensorflow-keras",
    "tensorflow-text",
    "tensorflow-datasets",
    "tensorflow-recommenders",
    # PyTorch related (macOS compatible)
    "torch>=2.0.0",
    "torchvision",
    "torchaudio",
    # torchrec alternatives for macOS:
    "torch-geometric", # For graph neural networks and recommendations
    "pytorch-lightning", # For training infrastructure
    # Data science
    "h5py",
    "keras>=2.13.1rc0",
    "scikit-learn",
    # Notebook & documentation
    "jupyter",
    "ipykernel",
    "mkdocs",
    # Testing
    "pytest",
    "pytest-custom-exit-code",
    "pytest-cov",
    # Code quality
    "flake8",
    # Finance
    "yfinance",
    "tabulate",
    "matplotlib",
    # LLM & ML
    "faiss-cpu",
    "openai",
    "streamlit",
    "huggingface-hub",
    "charset-normalizer",
    "transformers>=4.54.0",
    "pyyaml>=6.0.0",
    "datasets",
    "tiktoken",
    "tqdm",
    # "wandb",  # Temporarily disabled due to PyYAML build issues
    "airllm",
    "absl-py",
    # Computer vision (some may need system dependencies)
    "opencv-python",
    # Note: face_recognition, dlib, deepface may need compilation - add manually if needed
    # Other utilities
    "google-api-python-client",
    "python-dotenv",
    # Note: bilibili-api, openai-agents, ray may need newer versions - add manually if needed
    "ib-insync>=0.9.86",
    "ibapi>=9.81.1.post1",
    "pytesseract>=0.3.13",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-custom-exit-code>=0.3.0",
    "flake8>=7.0.0",
]

# Security floors for packages that arrive transitively (or whose own constraint is loose).
# Each is the first patched release named by the open Dependabot advisories; raise it
# when a new advisory lands. accelerate and pytorch-lightning have no patched tag in the
# advisory, so the floor is the first release above the vulnerable range.
constraint-dependencies = [
    "accelerate>1.14.0",
    "aiohttp>=3.14.4",
    "anyio>=4.14.2",
    "bleach>=6.4.0",
    "filelock>=3.20.3",
    "fonttools>=4.60.2",
    "fsspec>=2026.6.0",
    "httplib2>=0.32.0",
    "idna>=3.15",
    "jupyter-server>=2.20.0",
    "jupyterlab>=4.5.11",
    "keras>=3.15.0",
    "mistune>=3.3.0",
    "nbconvert>=7.17.1",
    "notebook>=7.5.6",
    "pillow>=12.3.0",
    "protobuf>=5.29.6",
    "pyarrow>=23.0.1",
    "pyasn1>=0.6.4",
    "pygments>=2.20.0",
    "python-dotenv>=1.2.2",
    "pytorch-lightning>2.6.0",
    "requests>=2.33.0",
    "setuptools>=83.0.0",
    "soupsieve>=2.9.0",
    "streamlit>=1.54.0",
    "tornado>=6.5.9",
    "urllib3>=2.8.0",
    "werkzeug>=3.1.9",
    "wheel>=0.46.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.flake8]
max-line-length = 160

[tool.pytest.ini_options]
# Baseline for the legacy research workbench: tests that run on a clean checkout with no
# credentials, network, browser or GPU. Deliberately NOT collected (they need a service):
#   src/fin/broker_interact/   Interactive Brokers gateway (ib_insync / ibapi)
#   src/utils/web/chrome_driver/   Selenium and a Chrome install
#   src/ml/env_test/   torch / torchvision / transformers environment probes
# ai-workflows/* projects have their own environments and CI.
testpaths = ["tests", "src/lc"]
# py.test (used by `make test`) does not put the repo root on sys.path; `python -m pytest` does.
pythonpath = ["."]
