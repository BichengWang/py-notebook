# Dependabot version updates. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# ai-workflows/ai-decision-reliability is intentionally not listed: RELIA pins
# exact versions in its own uv.lock for byte-identical reproduction, so its
# dependencies change only through its release process.

version: 2
updates:
  # Root research environment: pyproject.toml, uv.lock and requirements.txt.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"

  # SHA-pinned actions in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
