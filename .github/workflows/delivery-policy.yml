name: Delivery policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: Delivery policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Controller regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_continual_delivery.py' -v
      - name: Workspace tool regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_workspace.py' -v
      - name: Publication evidence integrity tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_publication_evidence.py' -v
      - name: Release tooling regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_release.py' -v
      - name: Pages build tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_pages.py' -v
      - name: Outreach trigger regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_outreach.py' -v
      - name: Workspace manifest, CI routing, and import boundaries
        run: python3 scripts/workspace.py check
      - name: Changed Python syntax
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' \
            | while IFS= read -r path; do
                if [[ "$path" == *.py && -f "$path" ]]; then
                  python3 -m py_compile "$path"
                fi
              done
      - name: Affected components
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate \
              --jq '.[] | .filename, (.previous_filename // empty)' \
            | python3 scripts/workspace.py affected --paths-from - --format markdown >> "$GITHUB_STEP_SUMMARY"
