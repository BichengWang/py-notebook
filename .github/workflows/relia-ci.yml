name: RELIA CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect project and integration changes
        id: paths
        shell: bash
        # workspace.json lists the paths that affect RELIA; manual runs, new
        # branches, and manifest changes always validate.
        run: python3 scripts/workspace.py github-changes --component relia >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: ai-workflows/ai-decision-reliability
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.11"
          working-directory: ai-workflows/ai-decision-reliability
          enable-cache: false
      - name: Install the independent frozen project
        run: |
          mkdir -p "$RUNNER_TEMP/relia-ci"
          test "$(cat .python-version)" = "3.13.7"
          uv sync --frozen 2>&1 | tee "$RUNNER_TEMP/relia-ci/setup.log"
          { uv --version; uv run --frozen python --version; sha256sum uv.lock; uv pip freeze; } \
            | tee "$RUNNER_TEMP/relia-ci/environment.log"
          uv run --frozen python scripts/environment.py > "$RUNNER_TEMP/relia-ci/environment.json" \
            2>> "$RUNNER_TEMP/relia-ci/environment.log"
      - name: Test local export isolation
        working-directory: .
        run: python3 -m unittest discover -s scripts/tests -p test_export_relia.py -v
      - name: Run the full project suite, including benchmark runs
        run: |
          uv run --frozen python -m pytest -q --basetemp "$RUNNER_TEMP/relia-ci/tests" \
            2>&1 | tee "$RUNNER_TEMP/relia-ci/pytest.log"
      - name: Retain validation logs and test outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relia-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/relia-ci
          retention-days: 30

  required:
    name: RELIA required
    needs: [changes, validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful validation or a verified unrelated change
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        shell: bash
        run: |
          test "$CHANGES_RESULT" = success
          if [[ "$RELEVANT" == true ]]; then
            test "$VALIDATE_RESULT" = success
          else
            test "$RELEVANT" = false
            test "$VALIDATE_RESULT" = skipped
          fi
