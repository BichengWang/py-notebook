name: Conformance

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/conformance/**"
      - "ai-workflows/*/conformance/**"
      - "ai-workflows/*/*/schema/**"
      - ".github/workflows/conformance.yml"
      - "workspace.json"
  push:
    branches: [main]
    paths:
      - "scripts/conformance/**"
      - "ai-workflows/*/conformance/**"
      - "ai-workflows/*/*/schema/**"
      - ".github/workflows/conformance.yml"
      - "workspace.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: conformance (node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: scripts/conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/conformance/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Checker self-tests
        run: node --test
      - name: Validate schemas and recompute digests of every conformance vector
        run: node verify.mjs
