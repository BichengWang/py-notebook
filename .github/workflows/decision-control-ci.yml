name: decision-control CI

on:
  pull_request:
    branches: [main]
    paths:
      - "ai-workflows/decision-control/**"
      - ".github/workflows/decision-control-ci.yml"
      - "workspace.json"
  push:
    branches: [main]
    paths:
      - "ai-workflows/decision-control/**"
      - ".github/workflows/decision-control-ci.yml"
      - "workspace.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: decision-control (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
        working-directory: ai-workflows/decision-control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install standalone package
        run: python -m pip install .
      - name: Exercise installed decision lifecycle
        run: |
          decision-control demo --out "$RUNNER_TEMP/decision-control-demo"
          decision-control replay --record "$RUNNER_TEMP/decision-control-demo/record-review.json"
