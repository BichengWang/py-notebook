name: decision-control CI

on:
  pull_request:
    branches: [main]
    paths:
      - "ai-workflows/decision-control/**"
      - ".github/workflows/decision-control-ci.yml"
      - "workspace.json"
  push:
    branches: [main]
    paths:
      - "ai-workflows/decision-control/**"
      - ".github/workflows/decision-control-ci.yml"
      - "workspace.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: decision-control (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
        working-directory: ai-workflows/decision-control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/decision-control-venv"
          "$RUNNER_TEMP/decision-control-venv/bin/python" -m pip install dist/*.whl
      - name: Exercise installed wheel outside source tree
        run: |
          bash scripts/smoke-wheel.sh "$RUNNER_TEMP/decision-control-venv" \
            "$RUNNER_TEMP/decision-control-smoke" "$PWD/examples"
