name: decision-control CI

on:
  pull_request:
    branches: [main]
    paths:
      - "ai-workflows/decision-control/**"
      - ".github/workflows/decision-control-ci.yml"
      - "workspace.json"
  push:
    branches: [main]
    paths:
      - "ai-workflows/decision-control/**"
      - ".github/workflows/decision-control-ci.yml"
      - "workspace.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: decision-control (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
        working-directory: ai-workflows/decision-control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests without policy tools (standard library only; schema tests and opa/cedar re-evaluation tests skip)
        run: |
          if command -v opa || command -v cedar; then echo "opa and cedar must not be on PATH for this step" >&2; exit 1; fi
          python -m unittest discover -s tests -v
      - name: Install pinned OPA and Cedar CLI release binaries (checksum verified)
        env:
          OPA_VERSION: "1.21.2"
          OPA_SHA256: 830ab11f61ffec760b5e19db0d7ad02bf037e13f5ef4d665faeaf17632177527
          CEDAR_CLI_VERSION: "4.14.0"
          CEDAR_CLI_SHA256: 2db9a0dbf6555c256c11c688b67f043ddbf9af06bdd1bf8d7c9fff3fa2e81886
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/policy-tools/bin"
          mkdir -p "$bin"
          curl -fsSL --retry 3 -o "$bin/opa" \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  $bin/opa" | sha256sum --check --strict -
          chmod +x "$bin/opa"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cedar.tar.xz" \
            "https://github.com/cedar-policy/cedar/releases/download/cedar-policy-cli-v${CEDAR_CLI_VERSION}/cedar-policy-cli-x86_64-unknown-linux-gnu.tar.xz"
          echo "${CEDAR_CLI_SHA256}  $RUNNER_TEMP/cedar.tar.xz" | sha256sum --check --strict -
          tar -xJf "$RUNNER_TEMP/cedar.tar.xz" -C "$bin" --strip-components=1 \
            cedar-policy-cli-x86_64-unknown-linux-gnu/cedar
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/opa" version
          "$bin/cedar" --version
      - name: Unit tests with opa and cedar installed (frozen decisions are re-evaluated)
        env:
          DECISION_CONTROL_REQUIRE_POLICY_TOOLS: "1"
        run: python -m unittest discover -s tests -v
      - name: Install pinned dev-only schema validator
        run: |
          python -m pip install jsonschema==4.23.0 jsonschema-specifications==2024.10.1 \
            referencing==0.36.2 rpds-py==0.24.0 attrs==25.3.0
      - name: Schema and conformance tests with jsonschema
        run: |
          python -m unittest discover -s tests -p 'test_schema.py' -v
          python -m unittest discover -s tests -p 'test_conformance.py' -v
      - name: Validate demo and evaluation output against the shipped schemas
        run: |
          python -m decisioncontrol demo --out "$RUNNER_TEMP/dc-demo" > /dev/null
          python -m decisioncontrol evaluate --cases examples/evaluation-cases.jsonl \
            --policy examples/policy.json --out "$RUNNER_TEMP/dc-evaluation" > /dev/null
          python - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, sys
          from importlib import resources
          import jsonschema

          def validator(name):
              schema = json.loads((resources.files("decisioncontrol") / "schema" / name).read_text(encoding="utf-8"))
              jsonschema.Draft202012Validator.check_schema(schema)
              return jsonschema.Draft202012Validator(schema)

          root = pathlib.Path(sys.argv[1])
          records = sorted((root / "dc-demo").glob("record-*.json"))
          assert len(records) == 4, records
          check = validator("record.v5.json")
          for path in records:
              check.validate(json.loads(path.read_text(encoding="utf-8")))
          for path in sorted(pathlib.Path("fixtures/policy-engines/records").glob("*.json")):
              check.validate(json.loads(path.read_text(encoding="utf-8")))
          validator("evaluation.v2.json").validate(
              json.loads((root / "dc-evaluation" / "evaluation.json").read_text(encoding="utf-8")))
          print(f"validated {len(records)} demo records and 1 evaluation report")
          PY
      - name: Replay recorded OPA and Cedar fixtures with re-evaluation required
        run: |
          for record in fixtures/policy-engines/records/*.json; do
            python -m decisioncontrol replay --record "$record" --require-reevaluation > "$RUNNER_TEMP/replay.json"
            grep -q '"verification": "reevaluated"' "$RUNNER_TEMP/replay.json"
          done
      - name: Replay the same fixtures digest-only, without opa or cedar on PATH
        run: |
          python_bin="$(command -v python)"
          for record in fixtures/policy-engines/records/*.json; do
            env PATH=/usr/bin:/bin "$python_bin" -m decisioncontrol replay --record "$record" \
              > "$RUNNER_TEMP/replay.json" 2> "$RUNNER_TEMP/replay.err"
            grep -q '"verification": "digest-only"' "$RUNNER_TEMP/replay.json"
            grep -q 'policy NOT re-evaluated' "$RUNNER_TEMP/replay.err"
            code=0
            env PATH=/usr/bin:/bin "$python_bin" -m decisioncontrol replay --record "$record" --require-reevaluation \
              > /dev/null 2>&1 || code=$?
            test "$code" -eq 2
          done
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/decision-control-venv"
          "$RUNNER_TEMP/decision-control-venv/bin/python" -m pip install dist/*.whl
      - name: Exercise installed wheel outside source tree
        run: |
          bash scripts/smoke-wheel.sh "$RUNNER_TEMP/decision-control-venv" \
            "$RUNNER_TEMP/decision-control-smoke" "$PWD/examples" "$PWD/conformance"

  sigstore:
    name: decision-control sigstore attestation
    # Keyless signing needs a GitHub OIDC token: not available to fork or Dependabot pull requests.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: ai-workflows/decision-control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Produce a record with the demo
        run: python -m decisioncontrol demo --out "$RUNNER_TEMP/sig-demo" > /dev/null
      - name: Sign the record keylessly with the GitHub OIDC identity
        run: |
          record="$RUNNER_TEMP/sig-demo/record-review.json"
          python -m decisioncontrol predicate --record "$record" --out "$RUNNER_TEMP/pred.json" > "$RUNNER_TEMP/predicate.json"
          type=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["predicate_type"])' "$RUNNER_TEMP/predicate.json")
          cosign attest-blob --yes --predicate "$RUNNER_TEMP/pred.json" --type "$type" \
            --bundle "$RUNNER_TEMP/record-review.sigstore.json" "$record"
      - name: Verify with the package verifier
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          record="$RUNNER_TEMP/sig-demo/record-review.json"
          bundle="$RUNNER_TEMP/record-review.sigstore.json"
          verify() {
            python -m decisioncontrol replay --record "$1" --require-signature --sigstore-bundle "$bundle" \
              --certificate-identity "$2" --certificate-oidc-issuer https://token.actions.githubusercontent.com
          }
          verify "$record" "$IDENTITY"
          # An edited and re-hashed record, and a different expected identity, must exit 1.
          python - "$record" "$RUNNER_TEMP/forged.json" <<'PY'
          import hashlib, json, sys
          from decisioncontrol.jcs import canonicalize
          document = json.load(open(sys.argv[1]))
          document["record"]["review"]["note"] = "edited after signing"
          document["sha256"] = hashlib.sha256(canonicalize(document["record"])).hexdigest()
          json.dump(document, open(sys.argv[2], "w"), indent=2)
          PY
          python -m decisioncontrol replay --record "$RUNNER_TEMP/forged.json" > /dev/null
          code=0; verify "$RUNNER_TEMP/forged.json" "$IDENTITY" || code=$?
          test "$code" -eq 1
          code=0; verify "$record" "https://github.com/someone-else/repo/.github/workflows/x.yml@refs/heads/main" || code=$?
          test "$code" -eq 1
