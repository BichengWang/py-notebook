# The local continual-delivery controller owns merge decisions. A label alone
# must never enable a merge. Keep cleanup separate from approval and CI gates.
name: Merged branch cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != 'relia-release' &&
      !startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        uses: actions/github-script@v9
        with:
          script: |
            const ref = `heads/${context.payload.pull_request.head.ref}`;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
              });
              core.info(`Deleted ${ref}`);
            } catch (e) {
              // 422: ref already gone (e.g. deleted by gh or by hand) — nothing to do.
              if (e.status === 422) {
                core.info(`${ref} already deleted.`);
              } else {
                throw e;
              }
            }
