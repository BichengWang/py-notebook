name: Stale
on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  stale-prs:
    name: Close stale PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-pr-message: |
            This PR is stale because it has been open 30 days with no activity.
            If the stale label remains and there are no comments, this will be closed in 5 days.
          close-pr-message: |
            This PR was closed because it has been stalled for 5 days with no activity.
          days-before-stale: 30
          days-before-close: 5
          days-before-issue-stale: -1
          # This action has no branch-name exemption. The job below owns cleanup.
          delete-branch: false
          operations-per-run: 200

  stale-branches:
    name: Remove stale branches
    runs-on: ubuntu-latest
    steps:
      - uses: fpicalausa/remove-stale-branches@9b829bc2975ade0c61e64e9613def53ec0732440 # v2.6.1
        with:
          operations-per-run: 500
          days-before-branch-stale: 30
          exempt-branches-regex: "^(main|master|relia-release|release/.*)$"
          exempt-protected-branches: true
          ignore-unknown-authors: true
          default-recipient: "(Unknown author)"
