name: Research baseline

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "setup.cfg"
      - "Makefile"
      - ".github/workflows/src-baseline.yml"
      - "workspace.json"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - "setup.cfg"
      - "Makefile"
      - ".github/workflows/src-baseline.yml"
      - "workspace.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: src baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python 3.11 is the newest version with wheels for the pinned pandas 1.5.3.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install the baseline's dependencies at the root pins
        run: python -m pip install -c requirements.txt pytest pytest-custom-exit-code flake8 pandas tabulate
      - name: Lint and test (no credentials, network, browser or GPU needed)
        run: make test
