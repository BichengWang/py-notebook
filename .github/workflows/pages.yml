name: Pages

# Builds the GitHub Pages site with scripts/pages.py and deploys it from main.
# The site serves each record schema at the path its $id names and mirrors the
# conformance vectors, so it is rebuilt whenever either changes.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/pages.py"
      - "ai-workflows/*/*/schema/**"
      - "ai-workflows/*/conformance/**"
      - "scripts/conformance/manifest.schema.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build site
        run: python3 scripts/pages.py build --out _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
