name: Feature request
description: Propose a focused improvement backed by a concrete need.
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - experiment-gate
        - jev-decision
        - decision-control
        - relia
        - workspace tooling
        - research workbench
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired behavior and alternatives considered.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence it is needed
      description: Give a concrete use case or observed limitation. Distinguish fixtures from live use.
    validations:
      required: true
